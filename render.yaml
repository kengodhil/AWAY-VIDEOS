services:
  - type: web
    name: away-videos
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --no-input && python manage.py seed_demo && gunicorn awayvideos.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SNIPPE_MOCK
        value: "true"
