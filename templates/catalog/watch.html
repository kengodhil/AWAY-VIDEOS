{% extends "catalog/base.html" %}
{% block title %}{{ video.title }} · AWAY Videos{% endblock %}
{% block content %}
<section class="watch-shell">
  <div class="player-frame">
    {% if video.video_url %}
    <video class="player" controls playsinline autoplay
      {% if video.thumbnail_url %}poster="{{ video.thumbnail_url }}"{% endif %}>
      <source src="{{ video.video_url }}" type="video/mp4">
    </video>
    {% endif %}
    <div class="player-actions">
      {% if can_download %}
      <a class="icon-btn" href="{% url 'download_video' video.pk %}"><span class="icon-label">⬇</span></a>
      {% else %}
      <a class="icon-btn" href="{% url 'pay_video' video.pk 'download' %}"><span class="icon-label">⬇</span></a>
      {% endif %}
    </div>
  </div>
  <div class="watch-meta">
    <h1>{{ video.title }}</h1>
  </div>
</section>
{% endblock %}
