{% extends "catalog/base.html" %}
{% block title %}Upload video · AWAY Videos{% endblock %}
{% block content %}
<section class="pay-shell">
  <div class="card pay-card studio-form-card">
    <p class="eyebrow">Studio</p>
    <h1>Upload video</h1>
    <form method="post" enctype="multipart/form-data" class="stack">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
      <label>
        {{ field.label }}
        {{ field }}
        {% if field.help_text %}<span class="muted" style="font-size:.8rem">{{ field.help_text }}</span>{% endif %}
        {{ field.errors }}
      </label>
      {% endfor %}
      <button class="btn" type="submit">Save video</button>
    </form>
    <p class="muted small-note"><a href="{% url 'studio_dashboard' %}">← Back</a></p>
  </div>
</section>
{% endblock %}
