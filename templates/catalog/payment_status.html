{% extends "catalog/base.html" %}
{% block title %}Payment · AWAY Videos{% endblock %}
{% block content %}
<section class="pay-shell">
  <div class="card pay-card center">
    <h1>{{ payment.video.title }}</h1>
    <p class="status-pill" id="status-pill">{{ payment.status }}</p>
    {% if mock and payment.status == "PENDING" %}
    <form method="post" action="{% url 'mock_complete_payment' payment.order_id %}">
      {% csrf_token %}
      <button class="btn" type="submit">LIPA</button>
    </form>
    {% endif %}
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var pill = document.getElementById("status-pill");
  function poll() {
    fetch("{% url 'payment_status_json' payment.order_id %}")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (pill) pill.textContent = data.status;
        if (data.status === "COMPLETED" && data.next_url) {
          window.location.href = data.next_url;
          return;
        }
        if (data.status === "PENDING") setTimeout(poll, 2500);
      })
      .catch(function () { setTimeout(poll, 4000); });
  }
  {% if payment.status == "PENDING" %}setTimeout(poll, 1500);{% endif %}
})();
</script>
{% endblock %}
